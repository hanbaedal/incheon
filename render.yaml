services:
  - type: web
    name: incheon-hospital-funeral
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Seoul
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: SUPERVISOR_USERNAME
        value: basic
      - key: SUPERVISOR_PASSWORD
        value: basic4444
      - key: SUPERVISOR_NAME
        value: 슈퍼바이저
