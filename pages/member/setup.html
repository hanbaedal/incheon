<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>최초 설정 | 상주 전용 서비스</title>
  <link rel="stylesheet" href="../../assets/css/member.css" />
  <style>
    .setup-card { max-width: 560px; margin: 0 auto; }
    .setup-steps { display: flex; gap: 8px; margin: 0 0 20px; flex-wrap: wrap; }
    .setup-steps span {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: #eef0f3; color: #6b7280;
    }
    .setup-steps span.on { background: #1f2a44; color: #fff; }
    .setup-steps span.done { background: #e8f5ee; color: #1e874b; }
    .check-list { display: grid; gap: 10px; margin: 12px 0 18px; }
    .check-list label {
      display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
      border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; cursor: pointer;
    }
    .check-list input { margin-top: 3px; }
    .setup-msg { min-height: 20px; color: #c0392b; font-size: 13px; margin: 8px 0; }
  </style>
</head>
<body>
  <header id="mHeader"></header>
  <div class="m-wrap">
    <div class="card setup-card">
      <div class="card-body">
        <h1 class="m-title" style="margin-top:0">상주 최초 설정</h1>
        <p class="m-lead">안전을 위해 비밀번호를 변경하고, 이용 안내를 확인한 뒤 서비스를 이용하실 수 있습니다.</p>
        <div class="setup-steps" id="setupSteps">
          <span id="stepPw">1. 비밀번호 변경</span>
          <span id="stepGuide">2. 이용 안내 확인</span>
        </div>
        <div id="panelPw">
          <div class="field"><label for="curPw">현재 비밀번호</label><input type="password" id="curPw" autocomplete="current-password" /></div>
          <div class="field"><label for="newPw">새 비밀번호 (4자 이상)</label><input type="password" id="newPw" autocomplete="new-password" /></div>
          <div class="field"><label for="newPw2">새 비밀번호 확인</label><input type="password" id="newPw2" autocomplete="new-password" /></div>
          <div class="setup-msg" id="pwMsg"></div>
          <button type="button" class="btn btn-gold btn-block" id="pwBtn">비밀번호 변경</button>
        </div>
        <div id="panelGuide" hidden>
          <p>아래 항목을 모두 확인한 뒤 진행해 주세요.</p>
          <div class="check-list">
            <label><input type="checkbox" id="c1" /> 장례 예약·주문 내역은 상주 계정으로만 조회할 수 있습니다.</label>
            <label><input type="checkbox" id="c2" /> 식음료·공산품 등 일부 항목은 발인 전 수기 정산될 수 있습니다.</label>
            <label><input type="checkbox" id="c3" /> 빈소·발인 정보는 주문 접수 후 변경이 제한될 수 있습니다.</label>
            <label><input type="checkbox" id="c4" /> 문의·서식·안내는 「장례안내」 메뉴에서 확인할 수 있습니다.</label>
          </div>
          <div class="setup-msg" id="guideMsg"></div>
          <button type="button" class="btn btn-gold btn-block" id="guideBtn">확인 완료 · 서비스 시작</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/korea-time.js"></script>
  <script src="../../assets/js/member-i18n.js"></script>
  <script src="../../assets/js/member.js"></script>
  <script>
    (async function () {
      const me = await memberHeader("setup");
      if (!me) return;
      mApplyI18n(document);

      const panelPw = document.getElementById("panelPw");
      const panelGuide = document.getElementById("panelGuide");
      const stepPw = document.getElementById("stepPw");
      const stepGuide = document.getElementById("stepGuide");

      function syncPanels(user) {
        const needPw = !!user.mustChangePassword;
        const needGuide = !user.guideAcknowledged;
        if (!needPw && !needGuide) {
          location.href = "/pages/member/shop.html";
          return;
        }
        panelPw.hidden = !needPw;
        panelGuide.hidden = needPw || !needGuide;
        stepPw.className = needPw ? "on" : "done";
        stepGuide.className = needPw ? "" : (needGuide ? "on" : "done");
      }

      syncPanels(me);

      document.getElementById("pwBtn").addEventListener("click", async () => {
        const msg = document.getElementById("pwMsg");
        msg.textContent = "";
        const currentPassword = document.getElementById("curPw").value;
        const newPassword = document.getElementById("newPw").value;
        const newPassword2 = document.getElementById("newPw2").value;
        if (!currentPassword || !newPassword) {
          msg.textContent = "현재·새 비밀번호를 입력해 주세요.";
          return;
        }
        if (newPassword.length < 4) {
          msg.textContent = "새 비밀번호는 4자 이상이어야 합니다.";
          return;
        }
        if (newPassword !== newPassword2) {
          msg.textContent = "새 비밀번호 확인이 일치하지 않습니다.";
          return;
        }
        try {
          const d = await mApi("/auth/change-password", {
            method: "POST",
            body: { currentPassword, newPassword },
          });
          mToast("비밀번호가 변경되었습니다.");
          syncPanels(d.user);
        } catch (e) {
          msg.textContent = e.message || "변경에 실패했습니다.";
        }
      });

      document.getElementById("guideBtn").addEventListener("click", async () => {
        const msg = document.getElementById("guideMsg");
        msg.textContent = "";
        const ids = ["c1", "c2", "c3", "c4"];
        if (!ids.every((id) => document.getElementById(id).checked)) {
          msg.textContent = "안내 항목을 모두 확인해 주세요.";
          return;
        }
        try {
          await mApi("/auth/ack-guide", { method: "POST", body: {} });
          mToast("이용 안내 확인이 완료되었습니다.");
          location.href = "/pages/member/shop.html";
        } catch (e) {
          msg.textContent = e.message || "저장에 실패했습니다.";
        }
      });
    })();
  </script>
</body>
</html>
